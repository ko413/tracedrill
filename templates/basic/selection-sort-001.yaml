id: selection-sort-001
title: 選択ソート
level: 3
access: free
tags: [for, 二重ループ, 配列, 交換, 整列]
array_base: 1
max_steps: 600
description: 関数 sort は、配列 data を昇順に整列して返す。まだ整列していない部分から最小の要素を探し、その部分の先頭と入れ替えることを繰り返す。配列の要素番号は 1 から始まる。

params:
  data: {type: int_array, length: [4, 5], range: [1, 9], unique: true}

source: |
  ○整数型の配列: sort(整数型の配列: data)
    整数型: i, j, min, tmp
    for (i を 1 から dataの要素数 － 1 まで 1 ずつ増やす)
      min ← i
      for (j を i ＋ 1 から dataの要素数 まで 1 ずつ増やす)
        if (data[j] < data[min])
          min ← j   // @upd
        endif
      endfor
      tmp ← data[i]
      data[i] ← data[min]
      data[min] ← tmp   // @swap
    endfor
    return data

call: "sort(${data})"

quality:
  - "count(upd) ≧ 2"

questions:
  - {type: return_value, weight: 0.2}
  - {type: var_at_line, line: swap, var: data, pass: random}
  - {type: exec_count, line: upd}
  - type: fill_blank
    blank: "data[j] < data[min]"
    distractors:
      - "data[j] > data[min]"
      - "data[j] < data[i]"
      - "data[j] < min"
      - "j < data[min]"
      - "data[i] < data[min]"

explanation: |
  外側の繰返しの i 回目で、i 番目以降の最小の要素を探し、i 番目と入れ替えます。
  1回終わるごとに、先頭から i 個が確定します。
