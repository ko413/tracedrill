id: array-reverse-001
title: 配列の並びを逆にする
level: 2
access: free
tags: [for, 配列, 交換, の商]
array_base: 1
description: 関数 reverse は、配列 data の要素の並びを逆順にして返す。配列の要素番号は 1 から始まる。

params:
  data: {type: int_array, length: [4, 9], range: [1, 9], unique: true}

source: |
  ○整数型の配列: reverse(整数型の配列: data)
    整数型: n ← dataの要素数
    整数型: i, tmp
    for (i を 1 から n ÷ 2 の商 まで 1 ずつ増やす)
      tmp ← data[i]
      data[i] ← data[n － i ＋ 1]
      data[n － i ＋ 1] ← tmp   // @swap
    endfor
    return data

call: "reverse(${data})"

questions:
  # 配列を見るだけで答えが分かるので、出題されにくくしている
  - {type: return_value, weight: 0.2}
  - {type: var_at_line, line: swap, var: data, pass: 1}
  - {type: exec_count, line: swap}
  - type: fill_blank
    blank: "n ÷ 2 の商"
    distractors:
      - "n"
      - "n － 1"
      - "n ÷ 2 の商 － 1"
      - "n ＋ 1"
      - "1"

explanation: |
  先頭側と末尾側の要素を、外側から順に入れ替えます。
  入替えは要素数の半分の回数で止めます。最後まで続けると、入れ替えたものを元に戻してしまうためです。
