id: recursion-sum-001
title: 再帰呼出しの戻り値
level: 2
access: free
tags: [再帰, if]
description: 関数 f は、自分自身を呼び出して値を計算する。

params:
  n: {type: int, range: [5, 16]}
  k: {type: int, range: [2, 3]}
  b: {type: int, range: [0, 1]}

source: |
  ○整数型: f(整数型: n)
    if (n ≦ 1)
      return ${b}
    endif
    return n ＋ f(n － ${k})   // @rec

call: "f(${n})"

quality:
  - "count(rec) ≧ 2"

questions:
  - {type: return_value}
  - {type: exec_count, line: rec}
  - type: fill_blank
    blank: "n － ${k}"
    distractors:
      - "n － 1"
      - "n － 5"
      - "n ÷ 2 の商"
      - "${k} － n"
      - "n"

explanation: |
  f(${n}) は ${n} ＋ f(${n} － ${k}) です。n が 1 以下になるまで呼出しが続き、そこで ${b} が返ります。
  戻ってくる順に足していくと ${result} になります。
